<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="냉장고매니저">
<title>냉장고 매니저</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --frost:#eef4f7; --ice:#d6eaf5; --cold:#b8d8ed; --deep:#2c5f7a;
  --accent:#e8834a; --accent2:#5aab8c; --text:#1e3a4a; --muted:#7a9aaa;
  --card:#fff; --border:#c8dde8; --danger:#e05252; --warn:#e8a042;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--frost);color:var(--text);min-height:100vh;
  background-image:radial-gradient(circle at 20% 0%,rgba(122,179,212,.18) 0%,transparent 50%),
  radial-gradient(circle at 80% 100%,rgba(90,171,140,.12) 0%,transparent 50%);}

/* HEADER */
.header{background:linear-gradient(135deg,var(--deep) 0%,#1a4a63 100%);padding:14px 16px 10px;color:#fff;
  position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(44,95,122,.25);}
.header-top{display:flex;align-items:center;justify-content:space-between;}
.header h1{font-family:'Gowun Dodum',serif;font-size:1.3rem;letter-spacing:-.5px;}
.header h1 span{color:#89d4f0;}
.header-date{font-size:.7rem;color:rgba(255,255,255,.5);margin-top:2px;}
.btn-backup{background:rgba(255,255,255,.15);border:none;color:#fff;font-size:.72rem;
  padding:5px 10px;border-radius:10px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}

/* TABS */
.tabs{display:flex;background:var(--card);border-bottom:2px solid var(--border);
  position:sticky;top:56px;z-index:99;}
.tab-btn{flex:1;padding:10px 4px;border:none;background:none;font-family:'Noto Sans KR',sans-serif;
  font-size:.75rem;font-weight:500;color:var(--muted);cursor:pointer;
  border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s;
  display:flex;flex-direction:column;align-items:center;gap:2px;}
.tab-btn .icon{font-size:1rem;}
.tab-btn.active{color:var(--deep);border-bottom-color:var(--accent);}

/* CONTENT */
.content{padding:14px;max-width:480px;margin:0 auto;}
.tab-content{display:none;}
.tab-content.active{display:block;}

/* SECTION HEAD */
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.section-title{font-family:'Gowun Dodum',serif;font-size:1rem;color:var(--deep);display:flex;align-items:center;gap:6px;}
.badge-count{background:var(--ice);color:var(--deep);font-size:.68rem;font-weight:700;padding:2px 7px;border-radius:20px;}
.btn-add{background:var(--accent);color:#fff;border:none;padding:7px 14px;border-radius:20px;
  font-size:.78rem;font-weight:600;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:opacity .15s;}
.btn-add:active{opacity:.8;}
.btn-add.green{background:var(--accent2);}

/* ZONE */
.zone{background:var(--card);border-radius:14px;border:1.5px solid var(--border);
  margin-bottom:16px;overflow:hidden;box-shadow:0 2px 8px rgba(44,95,122,.06);}
.zone-head{padding:9px 14px;font-size:.75rem;font-weight:700;letter-spacing:.6px;display:flex;align-items:center;gap:6px;}
.zone-freeze{background:linear-gradient(90deg,#b8d8ed,#d6eef8);color:#1a4a63;}
.zone-chill{background:linear-gradient(90deg,#d4ede3,#e8f5ee);color:#1a4a3a;}

/* ITEM */
.item{display:flex;align-items:center;padding:10px 14px;border-top:1px solid var(--border);gap:10px;
  transition:transform .15s, box-shadow .15s;position:relative;background:var(--card);}
.item.done{opacity:.5;}
.item.done .item-name{text-decoration:line-through;color:var(--muted);}
.item.drag-active{box-shadow:0 6px 20px rgba(44,95,122,.25);border-radius:10px;z-index:50;transform:scale(1.02);}
.item.drag-placeholder{opacity:.3;background:var(--ice);}
@keyframes item-wiggle{0%,100%{transform:rotate(0deg);}25%{transform:rotate(-1deg);}75%{transform:rotate(1deg);}}
.item.drag-active{animation:item-wiggle .25s ease-in-out infinite;}
.item-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);background:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.7rem;transition:all .15s;}
.item.done .item-check{background:var(--muted);border-color:var(--muted);color:#fff;}
.item-body{flex:1;min-width:0;}
.item-name{font-size:.88rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px;}
.meta-chip{font-size:.67rem;padding:1px 7px;border-radius:10px;font-weight:500;}
.chip-qty{background:var(--ice);color:var(--deep);}
.chip-ok{background:#e8f5ee;color:#2a7a55;}
.chip-warn{background:#fff3e0;color:#b35c00;}
.chip-danger{background:#fde8e8;color:var(--danger);}
.chip-memo{background:#f5f0ff;color:#6840c8;}
.item-actions{display:flex;gap:2px;flex-shrink:0;align-items:center;}
.drag-handle{font-size:1.1rem;color:var(--muted);cursor:grab;padding:4px 6px;touch-action:none;user-select:none;-webkit-user-select:none;}
.drag-handle:active{cursor:grabbing;color:var(--deep);}
.btn-icon{background:none;border:none;font-size:1rem;cursor:pointer;padding:4px 6px;border-radius:6px;color:var(--muted);}

/* EMPTY */
.empty-msg{text-align:center;padding:22px 16px;color:var(--muted);font-size:.82rem;}

/* FORMS */
.form-row{margin-bottom:13px;}
.form-label{font-size:.73rem;font-weight:600;color:var(--muted);margin-bottom:5px;display:block;}
.form-input,.form-select{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;
  font-size:.88rem;font-family:'Noto Sans KR',sans-serif;color:var(--text);background:var(--frost);
  outline:none;transition:border .15s;-webkit-appearance:none;}
.form-input:focus,.form-select:focus{border-color:var(--deep);background:#fff;}
.form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:13px;}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(20,50,65,.45);z-index:200;
  display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.overlay.open{opacity:1;pointer-events:all;}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:22px 18px 36px;width:100%;max-width:480px;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.32,1.1,.42,1);max-height:90vh;overflow-y:auto;}
.overlay.open .modal{transform:translateY(0);}
.modal-title{font-family:'Gowun Dodum',serif;font-size:1.1rem;color:var(--deep);margin-bottom:16px;}
.btn-submit{width:100%;padding:13px;background:var(--deep);color:#fff;border:none;border-radius:12px;
  font-size:.92rem;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;margin-top:4px;transition:opacity .15s;}
.btn-submit:active{opacity:.85;}
.btn-submit.green{background:var(--accent2);}
.btn-cancel{width:100%;padding:10px;background:none;color:var(--muted);border:none;
  font-size:.82rem;cursor:pointer;font-family:'Noto Sans KR',sans-serif;margin-top:2px;}

/* CONFIRM DIALOG */
.confirm-box{position:fixed;inset:0;background:rgba(20,50,65,.5);z-index:400;
  display:flex;align-items:center;justify-content:center;padding:20px;}
.confirm-box.hidden{display:none;}
.confirm-inner{background:#fff;border-radius:16px;padding:22px 20px;width:100%;max-width:320px;text-align:center;}
.confirm-msg{font-size:.9rem;color:var(--text);margin-bottom:18px;line-height:1.5;}
.confirm-btns{display:flex;gap:10px;}
.confirm-btns button{flex:1;padding:11px;border:none;border-radius:10px;font-size:.88rem;
  font-family:'Noto Sans KR',sans-serif;cursor:pointer;font-weight:600;}
.confirm-ok{background:var(--danger);color:#fff;}
.confirm-cancel{background:var(--frost);color:var(--muted);}

/* INGREDIENT PANEL */
.ingr-panel{background:var(--card);border-radius:14px;border:1.5px solid var(--border);
  margin-bottom:12px;overflow:hidden;box-shadow:0 2px 8px rgba(44,95,122,.06);}
.ingr-panel-head{padding:10px 14px;background:linear-gradient(90deg,#e8f4fb,#f4faff);
  display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;}
.ingr-panel-title{font-size:.82rem;font-weight:700;color:var(--deep);}
.ingr-toggle-icon{font-size:.72rem;color:var(--muted);}
.ingr-panel-body{padding:10px 14px 12px;}
.ingr-zone-label{font-size:.68rem;font-weight:700;letter-spacing:.5px;color:var(--muted);margin-bottom:6px;margin-top:8px;}
.ingr-zone-label:first-child{margin-top:0;}
.ingr-chips{display:flex;flex-wrap:wrap;gap:5px;}
.ingr-chip{font-size:.72rem;padding:3px 9px;border-radius:12px;font-weight:500;}
.ingr-chip.frozen{background:#daeef8;color:#1a5070;border:1px solid #b8d8ed;}
.ingr-chip.chilled{background:#d8f0e5;color:#1a4a35;border:1px solid #b0dcc8;}
.ingr-chip.exp-warn{background:#fde8e8;color:#b03030;border:1px solid #f5c0c0;}

/* CALENDAR */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.cal-nav-label{font-family:'Gowun Dodum',serif;font-size:.92rem;color:var(--deep);}
.cal-nav-btn{background:var(--card);border:1.5px solid var(--border);border-radius:8px;
  padding:5px 12px;font-size:.8rem;cursor:pointer;color:var(--deep);font-family:'Noto Sans KR',sans-serif;}
.cal-nav-btn:active{background:var(--ice);}
.cal-wrap{background:var(--card);border-radius:14px;border:1.5px solid var(--border);
  overflow:hidden;box-shadow:0 2px 8px rgba(44,95,122,.06);margin-bottom:14px;}
.cal-week-label{padding:6px 12px;font-size:.68rem;font-weight:700;letter-spacing:.4px;color:#fff;background:var(--deep);}
.cal-week-label.w2{background:#3a7a98;}
.cal-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--border);}
.cal-row:last-child{border-bottom:none;}
.cal-header-row .cal-cell{background:var(--frost);font-size:.68rem;font-weight:700;color:var(--muted);
  text-align:center;padding:4px 2px;min-height:unset;border-right:1px solid var(--border);cursor:default;}
.cal-header-row .cal-cell:last-child{border-right:none;}
.cal-header-row .cal-cell.sat{color:#3a7ab5;}
.cal-header-row .cal-cell.sun{color:var(--danger);}
.cal-cell{border-right:1px solid var(--border);padding:5px 3px 6px;min-height:68px;cursor:pointer;
  transition:background .12s;position:relative;min-width:0;}
.cal-cell:last-child{border-right:none;}
.cal-cell:active{background:var(--frost);}
.cal-cell.today-cell{background:#fff8f4;}
.cal-cell.selected-cell{background:#eaf5ff;}
.cal-day-num{font-size:.72rem;font-weight:700;text-align:center;margin-bottom:3px;color:var(--text);line-height:1;}
.cal-cell.today-cell .cal-day-num{background:var(--accent);color:#fff;border-radius:50%;
  width:20px;height:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 3px;}
.cal-cell.sat-cell .cal-day-num{color:#3a7ab5;}
.cal-cell.sun-cell .cal-day-num{color:var(--danger);}
.cal-meals{display:flex;flex-direction:column;gap:2px;}
.cal-meal-item{font-size:.58rem;padding:1px 3px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4;}
.cm-b{background:#fff3c0;color:#8a5500;}
.cm-l{background:#d8f0e5;color:#1a5535;}
.cm-d{background:#dce8fa;color:#1a3a8a;}
.cm-s{background:#fce8f5;color:#7a1a60;}
.cal-more{font-size:.56rem;color:var(--muted);text-align:center;margin-top:1px;}

/* MEAL DETAIL */
.meal-detail-panel{background:var(--card);border-radius:14px;border:1.5px solid var(--accent);
  padding:14px;margin-bottom:14px;display:none;box-shadow:0 2px 10px rgba(232,131,74,.12);}
.meal-detail-panel.open{display:block;}
.meal-detail-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.meal-detail-date{font-family:'Gowun Dodum',serif;font-size:1rem;color:var(--deep);}
.btn-detail-close{background:none;border:none;font-size:1rem;color:var(--muted);cursor:pointer;padding:2px 6px;}
.meal-slot{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--frost);}
.meal-slot:last-of-type{border-bottom:none;}
.meal-type-tag{font-size:.65rem;font-weight:700;padding:2px 7px;border-radius:8px;flex-shrink:0;min-width:32px;text-align:center;}
.tag-b{background:#fff8e0;color:#c47c00;}
.tag-l{background:#e8f5ee;color:#2a7a55;}
.tag-d{background:#eaf0fa;color:#2c4fa3;}
.tag-s{background:#fde8f5;color:#8a2a6a;}
.meal-name{flex:1;font-size:.84rem;}
.meal-sub{font-size:.7rem;color:var(--muted);font-style:italic;margin-top:1px;}
.btn-meal-add-detail{width:100%;margin-top:10px;padding:8px;background:none;
  border:1.5px dashed var(--cold);color:var(--muted);font-size:.78rem;border-radius:10px;
  cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
.meal-empty{font-size:.8rem;color:var(--muted);text-align:center;padding:10px 0;}

/* CART */
.cart-quick-row{display:flex;gap:8px;margin-bottom:12px;}
.cart-quick-row .form-input{flex:1;}
.cart-filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.filter-chip{font-size:.72rem;padding:4px 12px;border-radius:12px;border:none;cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;font-weight:500;background:var(--ice);color:var(--deep);transition:all .15s;}
.filter-chip.active{background:var(--deep);color:#fff;}
.cart-item{display:flex;align-items:center;padding:9px 14px;border-top:1px solid var(--border);gap:10px;}
.cart-item:first-child{border-top:none;}
.cart-item.bought{opacity:.5;}
.cart-item.bought .cart-item-name{text-decoration:line-through;color:var(--muted);}
.cart-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);background:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.7rem;transition:all .15s;}
.cart-item.bought .cart-check{background:var(--accent2);border-color:var(--accent2);color:#fff;}
.cart-item-body{flex:1;min-width:0;}
.cart-item-name{font-size:.88rem;font-weight:500;}
.cart-item-meta{font-size:.7rem;color:var(--muted);margin-top:1px;}
.btn-cart-clear{display:block;margin:10px auto 0;background:none;border:1.5px solid var(--border);
  border-radius:10px;padding:6px 16px;font-size:.75rem;color:var(--muted);cursor:pointer;font-family:'Noto Sans KR',sans-serif;}

/* STATS */
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-card{background:var(--card);border-radius:12px;border:1.5px solid var(--border);padding:12px 14px;text-align:center;}
.stat-num{font-family:'Gowun Dodum',serif;font-size:1.8rem;color:var(--deep);line-height:1;}
.stat-label{font-size:.68rem;color:var(--muted);margin-top:4px;}

/* BACKUP */
.backup-section{margin-bottom:18px;}
.backup-section-label{font-size:.8rem;font-weight:600;color:var(--text);margin-bottom:6px;}
.backup-desc{font-size:.72rem;color:var(--muted);margin-bottom:10px;}
.file-label{display:block;width:100%;padding:12px;background:var(--frost);
  border:1.5px dashed var(--border);border-radius:10px;text-align:center;font-size:.82rem;color:var(--muted);cursor:pointer;}
.divider{border:none;border-top:1px solid var(--border);margin:16px 0;}

/* TOAST */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--text);color:#fff;padding:9px 18px;border-radius:20px;font-size:.8rem;
  opacity:0;transition:all .25s;pointer-events:none;z-index:300;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <div>
      <h1>🧊 냉장고 <span>매니저</span></h1>
      <div style="font-size:11px;color:rgba(255,255,255,.5);letter-spacing:.06em;margin-top:2px;">by @rich_magnets</div>
    </div>
    <button class="btn-backup" onclick="openModal('modal-backup')">💾 백업</button>
  </div>
  <div class="header-date" id="headerDate"></div>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab-btn active" id="tab-fridge" onclick="switchTab('fridge')"><span class="icon">🧊</span>냉장·냉동</button>
  <button class="tab-btn" id="tab-meal"   onclick="switchTab('meal')"><span class="icon">🍽️</span>식단 계획</button>
  <button class="tab-btn" id="tab-cart"   onclick="switchTab('cart')"><span class="icon">🛒</span>장바구니</button>
  <button class="tab-btn" id="tab-stats"  onclick="switchTab('stats')"><span class="icon">📊</span>현황</button>
</div>

<!-- TAB: 냉장·냉동 -->
<div class="content tab-content active" id="tab-content-fridge">
  <div class="section-head">
    <div class="section-title">❄️ 냉동칸 <span class="badge-count" id="badge-frozen">0</span></div>
    <button class="btn-add" onclick="openItemModal('frozen', null)">+ 추가</button>
  </div>
  <div class="zone">
    <div class="zone-head zone-freeze">❄️ FROZEN · 냉동</div>
    <div id="list-frozen"></div>
  </div>
  <div class="section-head">
    <div class="section-title">🥬 냉장칸 <span class="badge-count" id="badge-chilled">0</span></div>
    <button class="btn-add" onclick="openItemModal('chilled', null)">+ 추가</button>
  </div>
  <div class="zone">
    <div class="zone-head zone-chill">🌿 CHILLED · 냉장</div>
    <div id="list-chilled"></div>
  </div>
</div>

<!-- TAB: 식단 계획 -->
<div class="content tab-content" id="tab-content-meal">
  <div class="ingr-panel">
    <div class="ingr-panel-head" onclick="toggleIngrPanel()">
      <div class="ingr-panel-title">🧺 현재 보유 식재료</div>
      <span class="ingr-toggle-icon" id="ingrToggleIcon">▲ 접기</span>
    </div>
    <div class="ingr-panel-body" id="ingrPanelBody"></div>
  </div>
  <div class="cal-nav">
    <button class="cal-nav-btn" onclick="changeBiWeek(-1)">◀</button>
    <div class="cal-nav-label" id="calNavLabel"></div>
    <button class="cal-nav-btn" onclick="changeBiWeek(1)">▶</button>
  </div>
  <div class="cal-wrap" id="calGrid"></div>
  <div class="meal-detail-panel" id="mealDetailPanel">
    <div class="meal-detail-head">
      <div class="meal-detail-date" id="mealDetailDate"></div>
      <button class="btn-detail-close" onclick="closeMealDetail()">✕</button>
    </div>
    <div id="mealDetailList"></div>
    <button class="btn-meal-add-detail" onclick="openMealModal()">+ 식단 추가</button>
  </div>
</div>

<!-- TAB: 장바구니 -->
<div class="content tab-content" id="tab-content-cart">
  <div class="cart-quick-row">
    <input class="form-input" id="cartQuickInput" placeholder="살 것 입력..." onkeydown="if(event.key==='Enter')quickAddCart()">
    <button class="btn-add" onclick="openCartDetail()">+ 상세</button>
    <button class="btn-add green" onclick="quickAddCart()">추가</button>
  </div>
  <div class="cart-filter-row">
    <button class="filter-chip active" onclick="setCartFilter('all',this)">전체</button>
    <button class="filter-chip" onclick="setCartFilter('식재료',this)">🥕 식재료</button>
    <button class="filter-chip" onclick="setCartFilter('생필품',this)">🧴 생필품</button>
    <button class="filter-chip" onclick="setCartFilter('기타',this)">📦 기타</button>
  </div>
  <div class="zone" id="cart-list"></div>
  <button class="btn-cart-clear" onclick="clearBoughtCart()">✅ 구매완료 항목 지우기</button>
</div>

<!-- TAB: 현황 -->
<div class="content tab-content" id="tab-content-stats">
  <div class="stats-row">
    <div class="stat-card"><div class="stat-num" id="stat-total">0</div><div class="stat-label">전체 식재료</div></div>
    <div class="stat-card"><div class="stat-num" id="stat-done">0</div><div class="stat-label">소진 완료</div></div>
    <div class="stat-card"><div class="stat-num" id="stat-exp">0</div><div class="stat-label">⚠️ 유통기한 임박</div></div>
    <div class="stat-card"><div class="stat-num" id="stat-meals">0</div><div class="stat-label">이번 주 식단</div></div>
  </div>
  <div class="section-head"><div class="section-title">⚠️ 유통기한 임박</div></div>

<div class="confirm-box hidden" id="confirmBox">

      <button class="confirm-ok"     onclick="confirmResolve(true)">삭제</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

/* ── STATE ── */
var state = (function(){
  try {
    var raw = localStorage.getItem('fridgeApp');
    if (!raw) return {items:[],meals:{},cart:[]};
    var s = JSON.parse(raw);
    if (!s.items) s.items = [];
    if (!s.meals) s.meals = {};
    if (!s.cart)  s.cart  = [];
    return s;
  } catch(e) { return {items:[],meals:{},cart:[]}; }
})();

function save() {
  try { localStorage.setItem('fridgeApp', JSON.stringify(state)); } catch(e) {}
}

/* ── UTILS ── */
/* 한국 시간(로컬) 기준 날짜 문자열 — toISOString()은 UTC라 하루 밀림 */
function localDateStr(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function todayStr() { return localDateStr(new Date()); }

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function daysUntil(d) {
  if (!d) return null;
  return Math.ceil((new Date(d) - new Date(todayStr())) / 86400000);
}

function fmtDate(d) {
  if (!d) return '';
  var p = d.split('-');
  return parseInt(p[1]) + '/' + parseInt(p[2]);
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function expChip(d) {
  if (!d) return '';
  var du = daysUntil(d);
  var cls, lbl;
  if (du < 0)       { cls='chip-danger'; lbl='⚠️ 만료'; }
  else if (du===0)  { cls='chip-danger'; lbl='⚠️ 오늘'; }
  else if (du<=3)   { cls='chip-danger'; lbl='⚠️ '+du+'일 남음'; }
  else if (du<=7)   { cls='chip-warn';   lbl='⏳ '+du+'일'; }
  else              { cls='chip-ok';     lbl='📅 '+fmtDate(d); }
  return '<span class="meta-chip '+cls+'">'+lbl+'</span>';
}

/* ── CUSTOM CONFIRM ── */
var _confirmResolve = null;

function customConfirm(msg, okLabel) {
  return new Promise(function(resolve) {
    _confirmResolve = resolve;
    document.getElementById('confirmMsg').textContent = msg;
    if (okLabel) document.querySelector('.confirm-ok').textContent = okLabel;
    else document.querySelector('.confirm-ok').textContent = '삭제';
    document.getElementById('confirmBox').classList.remove('hidden');
  });
}

function confirmResolve(val) {
  document.getElementById('confirmBox').classList.add('hidden');
  if (_confirmResolve) { _confirmResolve(val); _confirmResolve = null; }
}

/* ── TOAST ── */
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

/* ── HEADER DATE ── */
(function(){
  var d = new Date();
  var days = ['일','월','화','수','목','금','토'];
  document.getElementById('headerDate').textContent =
    d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')+
    ' ('+days[d.getDay()]+')';
})();

/* ── TABS ── */
function switchTab(name) {
  document.querySelectorAll('.tab-content').forEach(function(el){ el.classList.remove('active'); });
  document.querySelectorAll('.tab-btn').forEach(function(el){ el.classList.remove('active'); });
  document.getElementById('tab-content-'+name).classList.add('active');
  document.getElementById('tab-'+name).classList.add('active');
  if (name==='meal')  { renderIngrPanel(); renderCalendar(); }
  if (name==='cart')  renderCart();
  if (name==='stats') renderStats();
}

/* ── MODAL ── */
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function overlayClose(e, id) { if (e.target.id===id) closeModal(id); }

/* ── FRIDGE RENDER ── */
function renderFridge() {
  ['frozen','chilled'].forEach(function(zone) {
    var items = state.items.filter(function(i){ return i.zone===zone; });
    document.getElementById('badge-'+zone).textContent = items.filter(function(i){ return !i.done; }).length;
    var el = document.getElementById('list-'+zone);
    if (!items.length) { el.innerHTML='<div class="empty-msg">아직 없어요. 추가해 보세요!</div>'; return; }
    el.innerHTML = items.map(function(item){
      return '<div class="item" data-id="'+item.id+'" data-zone="'+zone+'">'+
        '<div class="item-check" onclick="toggleItem(\''+item.id+'\')">'+(item.done?'✓':'')+'</div>'+
        '<div class="item-body">'+
          '<div class="item-name"'+(item.done?' style="text-decoration:line-through;color:var(--muted)"':'')+'>'+esc(item.name)+'</div>'+
          '<div class="item-meta">'+
            (item.qty?'<span class="meta-chip chip-qty">'+esc(item.qty)+'</span>':'')+
            expChip(item.exp)+
            (item.memo?'<span class="meta-chip chip-memo">'+esc(item.memo)+'</span>':'')+
          '</div>'+
        '</div>'+
        '<div class="item-actions">'+
          '<span class="drag-handle" onpointerdown="handlePointerDown(event,this)">⠿</span>'+
          '<button class="btn-icon" onclick="openItemModal(\''+zone+'\',\''+item.id+'\')">✏️</button>'+
          '<button class="btn-icon" onclick="deleteItem(\''+item.id+'\')">🗑</button>'+
        '</div>'+
      '</div>';
    }).join('');
  });
}

/* ── 핸들(⠿)을 꾹 눌러서 순서 변경 ── */
function handlePointerDown(e, handleEl) {
  e.preventDefault();
  var item = handleEl.closest('.item');
  var zone = item.dataset.zone;
  var listEl = item.parentElement;
  var startY = e.clientY;
  var origRect = item.getBoundingClientRect();
  var moved = false;

  item.classList.add('drag-active');
  item.style.position = 'relative';
  item.style.zIndex = '50';
  if (navigator.vibrate) navigator.vibrate(15);

  function onMove(ev) {
    moved = true;
    var dy = ev.clientY - startY;
    item.style.transform = 'translateY(' + dy + 'px)';

    var siblings = Array.from(listEl.querySelectorAll('.item')).filter(function (s) { return s !== item; });
    var curCenterY = origRect.top + origRect.height / 2 + dy;

    for (var i = 0; i < siblings.length; i++) {
      var sib = siblings[i];
      var rect = sib.getBoundingClientRect();
      var sibMid = rect.top + rect.height / 2;
      if (curCenterY < sibMid) {
        if (item.nextSibling !== sib) listEl.insertBefore(item, sib);
        break;
      } else if (i === siblings.length - 1) {
        if (item.nextSibling !== null) listEl.appendChild(item);
      }
    }
  }

  function onUp() {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
    item.classList.remove('drag-active');
    item.style.transform = '';
    item.style.zIndex = '';
    if (moved) commitOrder(zone);
  }

  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);
}

function commitOrder(zone) {
  var listEl = document.getElementById('list-' + zone);
  var newOrderIds = Array.from(listEl.querySelectorAll('.item')).map(function (el) { return el.dataset.id; });
  var zoneItems = newOrderIds.map(function (id) {
    return state.items.find(function (i) { return i.id === id; });
  }).filter(Boolean);
  var otherItems = state.items.filter(function (i) { return i.zone !== zone; });
  state.items = otherItems.concat(zoneItems);
  save();
}

/* ── FRIDGE ADD/EDIT ── */
var _editId   = null;
var _editZone = 'frozen';

function openItemModal(zone, id) {
  _editZone = zone;
  _editId   = id || null;
  document.getElementById('modal-item-title').textContent =
    _editId ? '✏️ 식재료 수정' : (zone==='frozen'?'❄️ 냉동 재료 추가':'🥬 냉장 재료 추가');
  var item = _editId ? state.items.find(function(i){ return i.id===_editId; }) : null;
  document.getElementById('item-name').value = item ? item.name  : '';
  document.getElementById('item-qty').value  = item ? item.qty   : '';
  document.getElementById('item-exp').value  = item ? item.exp   : '';
  document.getElementById('item-memo').value = item ? item.memo  : '';
  openModal('modal-item');
}

function saveItem() {
  var name = document.getElementById('item-name').value.trim();
  if (!name) { showToast('이름을 입력해 주세요!'); return; }
  var qty  = document.getElementById('item-qty').value.trim();
  var exp  = document.getElementById('item-exp').value;
  var memo = document.getElementById('item-memo').value.trim();
  if (_editId) {
    var item = state.items.find(function(i){ return i.id===_editId; });
    if (item) { item.name=name; item.qty=qty; item.exp=exp; item.memo=memo; }
    showToast('✏️ 수정했어요!');
  } else {
    state.items.push({ id:uid(), zone:_editZone, name:name, qty:qty, exp:exp, memo:memo, done:false });
    showToast('✅ 추가했어요!');
  }
  save(); closeModal('modal-item'); renderFridge();
}

function toggleItem(id) {
  var item = state.items.find(function(i){ return i.id===id; });
  if (item) { item.done=!item.done; save(); renderFridge(); }
}

function deleteItem(id) {
  customConfirm('이 항목을 삭제할까요?').then(function(ok){
    if (!ok) return;
    state.items = state.items.filter(function(i){ return i.id!==id; });
    save(); renderFridge();
    showToast('🗑 삭제했어요');
  });
}

/* ── INGREDIENT PANEL ── */
var _ingrOpen = true;

function toggleIngrPanel() {
  _ingrOpen = !_ingrOpen;
  document.getElementById('ingrPanelBody').style.display = _ingrOpen ? '' : 'none';
  document.getElementById('ingrToggleIcon').textContent  = _ingrOpen ? '▲ 접기' : '▼ 펼치기';
}

function renderIngrPanel() {
  var active  = state.items.filter(function(i){ return !i.done; });
  var frozen  = active.filter(function(i){ return i.zone==='frozen'; });
  var chilled = active.filter(function(i){ return i.zone==='chilled'; });
  var el = document.getElementById('ingrPanelBody');
  if (!active.length) { el.innerHTML='<div class="empty-msg" style="padding:8px 0">보유 중인 식재료가 없어요</div>'; return; }
  var html = '';
  if (frozen.length) {
    html += '<div class="ingr-zone-label">❄️ 냉동</div><div class="ingr-chips">';
    html += frozen.map(function(i){
      var warn = i.exp && daysUntil(i.exp)<=3;
      return '<span class="ingr-chip '+(warn?'exp-warn':'frozen')+'">'+(warn?'⚠️ ':'')+esc(i.name)+(i.qty?' · '+esc(i.qty):'')+' </span>';
    }).join('');
    html += '</div>';
  }
  if (chilled.length) {
    html += '<div class="ingr-zone-label">🥬 냉장</div><div class="ingr-chips">';
    html += chilled.map(function(i){
      var warn = i.exp && daysUntil(i.exp)<=3;
      return '<span class="ingr-chip '+(warn?'exp-warn':'chilled')+'">'+(warn?'⚠️ ':'')+esc(i.name)+(i.qty?' · '+esc(i.qty):'')+' </span>';
    }).join('');
    html += '</div>';
  }
  el.innerHTML = html;
}

/* ── CALENDAR ── */
var _biWeek = 0;
var _selDate = null;

function getMonday(offset) {
  var now = new Date(); var dow = now.getDay();
  var m = new Date(now);
  m.setDate(now.getDate() - (dow===0?6:dow-1));
  m.setHours(0,0,0,0);
  m.setDate(m.getDate() + offset*14);
  return m;
}

function getBiWeekDates(offset) {
  var mon = getMonday(offset); var dates = [];
  for (var i=0;i<14;i++) { var d=new Date(mon); d.setDate(mon.getDate()+i); dates.push(localDateStr(d)); }
  return dates;
}

function changeBiWeek(dir) { _biWeek+=dir; closeMealDetail(); renderCalendar(); }

function renderCalendar() {
  var dates = getBiWeekDates(_biWeek);
  var td = todayStr();
  var tCls = {b:'cm-b',l:'cm-l',d:'cm-d',s:'cm-s'};
  var dlbls = ['월','화','수','목','금','토','일'];

  document.getElementById('calNavLabel').textContent = fmtDate(dates[0])+' ~ '+fmtDate(dates[13]);

  var hdr = '<div class="cal-row cal-header-row">'+
    dlbls.map(function(l,i){ return '<div class="cal-cell'+(i===5?' sat':i===6?' sun':'')+'">'+l+'</div>'; }).join('')+
    '</div>';

  function mkRow(wDates, label, cls) {
    var cells = wDates.map(function(date,i){
      var dn = parseInt(date.split('-')[2]);
      var isT = date===td; var isS = date===_selDate; var isSat=i===5; var isSun=i===6;
      var cc = 'cal-cell'+(isT?' today-cell':'')+(isS?' selected-cell':'')+(isSat?' sat-cell':'')+(isSun?' sun-cell':'');
      var meals = state.meals[date]||[];
      var shown = meals.slice(0,3); var extra = meals.length-shown.length;
      var mHtml = shown.map(function(m){ return '<div class="cal-meal-item '+(tCls[m.type]||'cm-l')+'">'+esc(m.name)+'</div>'; }).join('');
      if (extra>0) mHtml += '<div class="cal-more">+'+extra+'</div>';
      return '<div class="'+cc+'" onclick="selectDay(\''+date+'\')"><div class="cal-day-num">'+dn+'</div><div class="cal-meals">'+mHtml+'</div></div>';
    }).join('');
    return '<div class="cal-week-label'+(cls?' '+cls:'')+'">'+label+'</div><div class="cal-row">'+cells+'</div>';
  }

  var w1=dates.slice(0,7); var w2=dates.slice(7,14);
  var l1='1주차 · '+parseInt(w1[0].split('-')[1])+'월 '+fmtDate(w1[0])+' ~ '+fmtDate(w1[6]);
  var l2='2주차 · '+parseInt(w2[0].split('-')[1])+'월 '+fmtDate(w2[0])+' ~ '+fmtDate(w2[6]);
  document.getElementById('calGrid').innerHTML = hdr + mkRow(w1,l1,'') + mkRow(w2,l2,'w2');
}

function selectDay(date) {
  _selDate = date;
  var p = date.split('-');
  var dnames = ['일','월','화','수','목','금','토'];
  document.getElementById('mealDetailDate').textContent =
    parseInt(p[1])+'월 '+parseInt(p[2])+'일 ('+dnames[new Date(+p[0],p[1]-1,+p[2]).getDay()]+')';
  renderMealDetail();
  var panel = document.getElementById('mealDetailPanel');
  panel.classList.add('open');
  panel.scrollIntoView({behavior:'smooth',block:'nearest'});
  renderCalendar();
}

function closeMealDetail() {
  _selDate = null;
  document.getElementById('mealDetailPanel').classList.remove('open');
  renderCalendar();
}

function renderMealDetail() {
  if (!_selDate) return;
  var meals = state.meals[_selDate]||[];
  var tInfo = {b:{tag:'tag-b',lbl:'아침'},l:{tag:'tag-l',lbl:'점심'},d:{tag:'tag-d',lbl:'저녁'},s:{tag:'tag-s',lbl:'간식'}};
  var el = document.getElementById('mealDetailList');
  if (!meals.length) { el.innerHTML='<div class="meal-empty">아직 등록된 식단이 없어요</div>'; return; }
  el.innerHTML = meals.map(function(m,mi){
    var ti = tInfo[m.type]||{tag:'tag-l',lbl:'점심'};
    return '<div class="meal-slot">'+
      '<span class="meal-type-tag '+ti.tag+'">'+ti.lbl+'</span>'+
      '<div style="flex:1;min-width:0">'+
        '<div class="meal-name">'+esc(m.name)+'</div>'+
        (m.ing?'<div class="meal-sub">🧺 '+esc(m.ing)+'</div>':'')+
        (m.note?'<div class="meal-sub">💬 '+esc(m.note)+'</div>':'')+
      '</div>'+
      '<button class="btn-icon" onclick="deleteMeal(\''+_selDate+'\','+mi+')">✕</button>'+
    '</div>';
  }).join('');
}

function openMealModal() {
  if (!_selDate) return;
  document.getElementById('meal-name').value='';
  document.getElementById('meal-ing').value='';
  document.getElementById('meal-note').value='';
  document.getElementById('meal-type').value='l';
  openModal('modal-meal');
}

function saveMeal() {
  var name = document.getElementById('meal-name').value.trim();
  if (!name) { showToast('메뉴 이름을 입력해 주세요!'); return; }
  if (!_selDate) { showToast('날짜를 먼저 선택해 주세요!'); return; }
  if (!state.meals[_selDate]) state.meals[_selDate]=[];
  state.meals[_selDate].push({
    type: document.getElementById('meal-type').value,
    name: name,
    ing:  document.getElementById('meal-ing').value.trim(),
    note: document.getElementById('meal-note').value.trim()
  });
  save(); closeModal('modal-meal'); renderCalendar(); renderMealDetail();
  showToast('🍽️ 식단 추가!');
}

function deleteMeal(date, idx) {
  customConfirm('이 식단을 삭제할까요?').then(function(ok){
    if (!ok) return;
    state.meals[date].splice(idx,1);
    if (!state.meals[date].length) delete state.meals[date];
    save(); renderCalendar(); renderMealDetail();
  });
}

/* ── CART ── */
var _cartFilter = 'all';

function setCartFilter(cat, el) {
  _cartFilter = cat;
  document.querySelectorAll('.filter-chip').forEach(function(b){ b.classList.remove('active'); });
  el.classList.add('active');
  renderCart();
}

function openCartDetail() {
  var name = document.getElementById('cartQuickInput').value.trim();
  document.getElementById('cart-name').value = name;
  document.getElementById('cart-qty').value  = '';
  document.getElementById('cart-memo').value = '';
  document.getElementById('cart-cat').value  = '식재료';
  openModal('modal-cart');
}

function quickAddCart() {
  var name = document.getElementById('cartQuickInput').value.trim();
  if (!name) return;
  state.cart.push({id:uid(),name:name,qty:'',cat:'식재료',memo:'',bought:false});
  save();
  document.getElementById('cartQuickInput').value='';
  renderCart();
  showToast('🛒 추가했어요!');
}

function saveCartItem() {
  var name = document.getElementById('cart-name').value.trim();
  if (!name) { showToast('이름을 입력해 주세요!'); return; }
  state.cart.push({
    id:uid(), name:name,
    qty:  document.getElementById('cart-qty').value.trim(),
    cat:  document.getElementById('cart-cat').value,
    memo: document.getElementById('cart-memo').value.trim(),
    bought:false
  });
  save();
  document.getElementById('cartQuickInput').value='';
  closeModal('modal-cart'); renderCart();
  showToast('🛒 추가했어요!');
}

function toggleCart(id) {
  var item = state.cart.find(function(i){ return i.id===id; });
  if (item) { item.bought=!item.bought; save(); renderCart(); }
}

function deleteCartItem(id) {
  customConfirm('이 항목을 삭제할까요?').then(function(ok){
    if (!ok) return;
    state.cart = state.cart.filter(function(i){ return i.id!==id; });
    save(); renderCart();
  });
}

function clearBoughtCart() {
  var cnt = state.cart.filter(function(i){ return i.bought; }).length;
  if (!cnt) { showToast('구매완료 항목이 없어요'); return; }
  customConfirm('구매완료 항목 '+cnt+'개를 모두 지울까요?','지우기').then(function(ok){
    if (!ok) return;
    state.cart = state.cart.filter(function(i){ return !i.bought; });
    save(); renderCart(); showToast('✅ 정리했어요!');
  });
}

function renderCart() {
  var list = _cartFilter==='all' ? state.cart : state.cart.filter(function(i){ return i.cat===_cartFilter; });
  var pending = list.filter(function(i){ return !i.bought; });
  var bought  = list.filter(function(i){ return  i.bought; });
  var sorted  = pending.concat(bought);
  var cIcon   = {'식재료':'🥕','생필품':'🧴','기타':'📦'};
  var el = document.getElementById('cart-list');
  if (!sorted.length) { el.innerHTML='<div class="empty-msg">항목이 없어요. 추가해 보세요!</div>'; return; }
  el.innerHTML = sorted.map(function(item){
    var sub = [item.qty,item.memo].filter(Boolean).join(' · ');
    return '<div class="cart-item'+(item.bought?' bought':'')+'">'+
      '<div class="cart-check" onclick="toggleCart(\''+item.id+'\')">'+(item.bought?'✓':'')+'</div>'+
      '<div class="cart-item-body">'+
        '<div class="cart-item-name">'+(cIcon[item.cat]||'')+' '+esc(item.name)+'</div>'+
        (sub?'<div class="cart-item-meta">'+esc(sub)+'</div>':'')+
      '</div>'+
      '<button class="btn-icon" onclick="deleteCartItem(\''+item.id+'\')">🗑</button>'+
    '</div>';
  }).join('');
}

/* ── STATS ── */
function renderStats() {
  var items = state.items;
  var expItems = items.filter(function(i){ return !i.done && i.exp && daysUntil(i.exp)<=3; });
  var wDates = getBiWeekDates(0).slice(0,7);
  var mCnt = wDates.reduce(function(a,d){ return a+(state.meals[d]||[]).length; },0);
  document.getElementById('stat-total').textContent = items.length;
  document.getElementById('stat-done').textContent  = items.filter(function(i){ return i.done; }).length;
  document.getElementById('stat-exp').textContent   = expItems.length;
  document.getElementById('stat-meals').textContent = mCnt;

  var expEl = document.getElementById('stat-exp-list');
  expEl.innerHTML = expItems.length ? expItems.map(function(item){
    return '<div class="item"><div class="item-body"><div class="item-name">'+esc(item.name)+' '+(item.zone==='frozen'?'❄️':'🥬')+'</div>'+
      '<div class="item-meta">'+expChip(item.exp)+(item.qty?'<span class="meta-chip chip-qty">'+esc(item.qty)+'</span>':'')+
      '</div></div></div>';
  }).join('') : '<div class="empty-msg">임박한 항목 없음 ✓</div>';

  var doneItems = items.filter(function(i){ return i.done; });
  var doneEl = document.getElementById('stat-done-list');
  doneEl.innerHTML = doneItems.length ? doneItems.map(function(item){
    return '<div class="item done"><div class="item-check">✓</div>'+
      '<div class="item-body"><div class="item-name">'+esc(item.name)+'</div></div>'+
      '<button class="btn-icon" onclick="deleteItem(\''+item.id+'\')">🗑</button></div>';
  }).join('') : '<div class="empty-msg">소진된 항목 없음</div>';
}

/* ── BACKUP ── */
function exportData() {
  var blob = new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url; a.download = '냉장고매니저_백업_'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('📥 백업 파일 저장됐어요!');
}

function importData(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    try {
      var imp = JSON.parse(ev.target.result);
      if (!imp.items||!imp.meals) { showToast('❌ 올바른 백업 파일이 아니에요'); return; }
      customConfirm('현재 데이터를 백업 파일로 덮어쓸까요?','덮어쓰기').then(function(ok){
        if (!ok) return;
        if (!imp.cart) imp.cart=[];
        state = imp; save();
        closeModal('modal-backup');
        renderFridge(); renderCart();
        showToast('✅ 복원 완료!');
      });
    } catch(err){ showToast('❌ 파일을 읽을 수 없어요'); }
    document.getElementById('importFileInput').value='';
  };
  reader.readAsText(file);
}

/* ── INIT ── */
renderFridge();
</script>
